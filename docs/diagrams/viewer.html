<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diagram viewer</title>
    <style>
        :root {
            color-scheme: light;
            --canvas: #eef1f4;
            --panel: #ffffff;
            --ink: #18212a;
            --muted: #5c6975;
            --border: #cbd3da;
            --accent: #0067b8;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            color: var(--ink);
            background:
                linear-gradient(90deg, rgb(24 33 42 / 4%) 1px, transparent 1px),
                linear-gradient(rgb(24 33 42 / 4%) 1px, transparent 1px),
                var(--canvas);
            background-size: 24px 24px;
            font-family: Avenir Next, Avenir, Segoe UI, sans-serif;
        }

        header {
            z-index: 2;
            display: flex;
            min-height: 56px;
            align-items: center;
            gap: 16px;
            padding: 8px 14px;
            border-bottom: 1px solid var(--border);
            background: rgb(255 255 255 / 94%);
            box-shadow: 0 2px 10px rgb(24 33 42 / 8%);
        }

        h1 {
            min-width: 0;
            margin: 0;
            overflow: hidden;
            font-size: 16px;
            font-weight: 650;
            letter-spacing: 0;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .toolbar {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }

        button {
            min-width: 38px;
            height: 36px;
            padding: 0 11px;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--ink);
            background: var(--panel);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover { border-color: var(--accent); }
        button:focus-visible { outline: 3px solid rgb(0 103 184 / 25%); }

        #zoom-level {
            width: 58px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        #viewport {
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #viewport.dragging { cursor: grabbing; }

        #diagram {
            position: absolute;
            top: 50%;
            left: 50%;
            display: block;
            max-width: none;
            transform-origin: center;
            filter: drop-shadow(0 8px 18px rgb(24 33 42 / 14%));
            pointer-events: none;
        }

        #error {
            display: none;
            place-items: center;
            height: 100%;
            padding: 32px;
            color: #8a1c1c;
            background: var(--panel);
            text-align: center;
        }

        @media (max-width: 620px) {
            header {
                align-items: flex-start;
                flex-direction: column;
                gap: 6px;
            }

            .toolbar {
                width: 100%;
                margin-left: 0;
            }

            .toolbar button { flex: 1 1 auto; }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="title">Diagram viewer</h1>
        <div class="toolbar" aria-label="Diagram controls">
            <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">-</button>
            <span id="zoom-level" aria-live="polite">100%</span>
            <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
            <button id="fit" type="button" title="Fit diagram to window">Fit</button>
            <button id="fullscreen" type="button" title="Enter fullscreen">Fullscreen</button>
        </div>
    </header>
    <main id="viewport" aria-label="Zoomable diagram. Drag to pan and use the mouse wheel to zoom.">
        <img id="diagram" alt="">
        <div id="error" role="alert">The requested diagram could not be loaded.</div>
    </main>

    <script>
        const diagrams = {
            'legacy-aap': {
                file: 'legacy-aap.svg',
                title: 'Legacy Application Access Policy',
                width: 2006,
                height: 296
            },
            'app-rbac': {
                file: 'app-rbac.svg',
                title: 'Exchange Online App RBAC',
                width: 2403.953125,
                height: 684
            },
            'migration-phases': {
                file: 'migration-phases.svg',
                title: 'Application Access Policy Migration Phases',
                width: 2224.953125,
                height: 118
            }
        };

        const requestedDiagram = new URLSearchParams(window.location.search).get('diagram');
        const selectedDiagram = diagrams[requestedDiagram] || diagrams['migration-phases'];
        const viewport = document.getElementById('viewport');
        const image = document.getElementById('diagram');
        const title = document.getElementById('title');
        const zoomLevel = document.getElementById('zoom-level');
        const error = document.getElementById('error');
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let dragStart = null;

        title.textContent = selectedDiagram.title;
        document.title = `${selectedDiagram.title} - Diagram viewer`;
        image.alt = selectedDiagram.title;
        image.style.width = `${selectedDiagram.width}px`;
        image.style.height = `${selectedDiagram.height}px`;
        image.src = selectedDiagram.file;

        function clamp(value, minimum, maximum) {
            return Math.min(maximum, Math.max(minimum, value));
        }

        function render() {
            image.style.transform = `translate(-50%, -50%) translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            zoomLevel.textContent = `${Math.round(scale * 100)}%`;
        }

        function fit() {
            const padding = 48;
            const availableWidth = Math.max(1, viewport.clientWidth - padding * 2);
            const availableHeight = Math.max(1, viewport.clientHeight - padding * 2);
            scale = clamp(Math.min(
                availableWidth / selectedDiagram.width,
                availableHeight / selectedDiagram.height
            ), 0.1, 4);
            offsetX = 0;
            offsetY = 0;
            render();
        }

        function zoom(factor, clientX = null, clientY = null) {
            const previousScale = scale;
            scale = clamp(scale * factor, 0.1, 8);
            const bounds = viewport.getBoundingClientRect();
            const pointX = clientX === null ? 0 : clientX - bounds.left - bounds.width / 2;
            const pointY = clientY === null ? 0 : clientY - bounds.top - bounds.height / 2;
            const ratio = scale / previousScale;
            offsetX = pointX - (pointX - offsetX) * ratio;
            offsetY = pointY - (pointY - offsetY) * ratio;
            render();
        }

        image.addEventListener('load', fit);
        image.addEventListener('error', () => {
            image.hidden = true;
            error.style.display = 'grid';
        });

        document.getElementById('zoom-in').addEventListener('click', () => zoom(1.25));
        document.getElementById('zoom-out').addEventListener('click', () => zoom(0.8));
        document.getElementById('fit').addEventListener('click', fit);
        document.getElementById('fullscreen').addEventListener('click', async () => {
            if (document.fullscreenElement) {
                await document.exitFullscreen();
            } else {
                await document.documentElement.requestFullscreen();
            }
        });

        viewport.addEventListener('wheel', (event) => {
            event.preventDefault();
            zoom(event.deltaY < 0 ? 1.12 : 0.89, event.clientX, event.clientY);
        }, { passive: false });

        viewport.addEventListener('pointerdown', (event) => {
            viewport.setPointerCapture(event.pointerId);
            viewport.classList.add('dragging');
            dragStart = { x: event.clientX - offsetX, y: event.clientY - offsetY };
        });

        viewport.addEventListener('pointermove', (event) => {
            if (!dragStart) return;
            offsetX = event.clientX - dragStart.x;
            offsetY = event.clientY - dragStart.y;
            render();
        });

        viewport.addEventListener('pointerup', () => {
            dragStart = null;
            viewport.classList.remove('dragging');
        });

        window.addEventListener('resize', fit);
        window.addEventListener('keydown', (event) => {
            if (event.key === '+' || event.key === '=') zoom(1.25);
            if (event.key === '-') zoom(0.8);
            if (event.key === '0') fit();
        });
    </script>
</body>
</html>
